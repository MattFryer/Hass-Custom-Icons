name: Sync Icons

# Runs whenever a push touches the Assets/Icons folder,
# or when the sync script itself is updated.
# Can also be triggered manually from the Actions tab.
on:
  push:
    branches:
      - main
    paths:
      - "Assets/Icons/**"
      - "update_icons.py"
  workflow_dispatch:          # manual trigger

permissions:
  contents: write             # needed to commit the updated files

jobs:
  sync-icons:
    name: Sync icon registry and README table
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repository (full depth so we can push back)
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Set up Python (stdlib only – no pip dependencies required)
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------------------------------------
      # 3. Validate all icon viewBoxes before touching any output files.
      #    The script exits with code 1 if any SVG does not use "0 0 24 24",
      #    which causes this step – and the whole job – to fail immediately.
      # -----------------------------------------------------------------------
      - name: Validate icon viewBoxes
        run: python update_icons.py --repo-root . --dry-run

      # -----------------------------------------------------------------------
      # 4. Run the sync script (writes JS, README and dashboard)
      # -----------------------------------------------------------------------
      - name: Run update_icons.py
        run: python update_icons.py --repo-root .

      # -----------------------------------------------------------------------
      # 5. Commit and push if anything changed
      # -----------------------------------------------------------------------
      - name: Commit changes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the managed files
          git add Hass-Custom-Icons.js README.md Assets/icon-testing-dashboard.yaml

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "Nothing to commit – files are already up-to-date."
          else
            git commit -m "chore: sync icon registry and README [skip ci]"
            git push
          fi